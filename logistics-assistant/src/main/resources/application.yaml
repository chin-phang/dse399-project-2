spring:
  application:
    name: logistics-assistant

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_logistics}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      # Liquibase owns the schema; Hibernate only checks that the mapping matches it.
      ddl-auto: validate
    # Entities never escape the service layer (DTOs at the boundary), so there is nothing
    # for a view-time session to lazily load.
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          # Env-overridable so dropping to the cheaper gpt-5.6-luna tier under
          # quota pressure is a config change, not a redeploy.
          model: ${OPENAI_CHAT_MODEL:gpt-5.6-terra}
    chat:
      memory:
        repository:
          jdbc:
            # The starter ships its own schema but initialises embedded databases
            # only by default, so on Postgres the table would never be created.
            initialize-schema: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    # HS256 needs >= 256 bits of key material. Override in every real environment.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTAxMjM0NTY3ODk=}
    access-token-ttl: ${JWT_ACCESS_TTL:PT1H}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  ai:
    # Upstream guard only. The "<=10s AI response" NFR is time-to-first-token and is enforced
    # client-side — a long but healthy answer must not be killed by the transport.
    connect-timeout: ${AI_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${AI_READ_TIMEOUT:PT30S}

logging:
  level:
    com.wou.logistics_assistant: INFO
